[workspace]
name = "physical-ai-runtime"
version = "0.1.0"
description = "Release-first ROS 2 Jazzy runtime for Physical AI systems"
authors = ["Gabriel-Ning <guomning@gmail.com>"]
# gabriel-robotics before conda-forge so Pixi-ABI libfranka (pixi1_*) wins over
# conda-forge's urdfdom-.5.1 build of the same name.
channels = [
    "robostack-jazzy",
    "https://prefix.dev/gabriel-robotics",
    "conda-forge",
]
# Match isaacteleop manylinux_2_35 so `pixi install --locked` does not treat the
# lock as stale relative to the direct wheel URL. Also satisfies Robostack
# realsense / libudev glibc floor on the cpu environment.
platforms = [{ platform = "linux-64", glibc = "2.35" }]

# Layered environments:
#   default / runtime / cpu — previous cpu robot stack (no CUDA)
#   curobo                  — runtime + CUDA 13 / Torch 2.13 / CloudXR
#   lerobot                 — ROS-only base + LeRobot CUDA 12.8 / Torch 2.11
#
# [dependencies] is the ROS-only provider layer so LeRobot can share rclpy
# without OpenCV / MoveIt / ros2_control.  CUDA solve groups stay separate.

[dependencies]
mcap = ">=1.2.0"
python = "3.12.*"

# ── Minimal ROS 2 policy-provider baseline ───────────────────────────────────
# Keep this layer free of OpenCV, MoveIt runtime, hardware SDKs, visualization,
# and ros2_control binaries so LeRobot can share the same Python process.
ros-jazzy-ros-core = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-action-msgs = "*"
ros-jazzy-control-msgs = "*"
ros-jazzy-controller-manager-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-moveit-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-trajectory-msgs = "*"
# Binary interface ABI shared by policy-provider and runtime environments.
ros-jazzy-execution-manager-interfaces = "==0.2.0"
pyyaml = "*"

# ── Full robot runtime / development layer ───────────────────────────────────
[feature.runtime.dependencies]
ros-jazzy-desktop = "*"

# ── Workspace tooling ────────────────────────────────────────────────────────
colcon-common-extensions = "*"
vcstool = "*"
rosdep = "*"
# Robostack ros-jazzy-launch-testing (3.4.10) registers a pytest11 plugin
# against the pre-9.0 `pytest_pycollect_makemodule(path, parent)` hookspec.
# pytest >=9 dropped that legacy parameter, so any colcon/ament_cmake_pytest
# test run fails at plugin load. Pin below the break until robostack ships a
# launch_testing build compatible with pytest 9.
pytest = ">=8,<9"
ruff = ">=0.12,<1"

# ── Native build toolchain ───────────────────────────────────────────────────
cmake = "*"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
sysroot_linux-64 = ">=2.39"
patchelf = "*"
swig = "*"
libusb = "*"
eigen = "*"

# ── ros2_control ─────────────────────────────────────────────────────────────
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-ros2-control-cmake = "*"

# ── Descriptions / fake hardware ─────────────────────────────────────────────
ros-jazzy-xacro = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-mujoco-vendor = "*"

# ── Robot SDKs (gabriel-robotics channel) ────────────────────────────────────
libpiper = "0.5.0.*"
libmarvin = "==0.1.0"
libmvs = "4.7.0.3.*"
# Franka: Pixi/robostack ABI (fmt 12 + pinocchio 4.0 + urdfdom 6). Not the
# official Ubuntu noble .deb (fmt v9 / Poco .80) and not conda-forge's
# urdfdom-.5.1 build. build=pixi1_* matches physical_ai_runtime pinocchio 4.0.
libfranka = { version = "==0.21.2", build = "pixi1_*" }
poco = ">=1.15.3,<1.15.4"

# ── Sensors / calibration ────────────────────────────────────────────────────
ros-jazzy-orbbec-camera = "*"
ros-jazzy-usb-cam = "*"
# RealSense: robostack packages (librealsense comes via ros-jazzy-librealsense2).
# Historical note: an older workspace used a colcon overlay of realsense-ros
# because of a then-unsolvable pin against ros-jazzy-realsense2-camera. With
# matching 2.57.7 / 4.57.7 on current channels, the full stack solves cleanly,
# so the overlay is no longer required for dependency reasons.
ros-jazzy-realsense2-camera = "*"
ros-jazzy-realsense2-camera-msgs = "*"
ros-jazzy-realsense2-description = "*"
# easy_handeye2 needs transforms3d beside rclpy/cv_bridge/numpy/cv2 (conda).
transforms3d = ">=0.4.2,<0.5"
ros-jazzy-apriltag = ">=3.4.5,<4"
ros-jazzy-apriltag-msgs = ">=2.0.1,<3"

# ── Motion planning / controllers (conda) ────────────────────────────────────
# Pinocchio 4.0 Python bindings (gabriel-robotics).  Keep out of the ROS-only
# base: LeRobot `all` vendors a different PyPI/cmeel placo.  The envs never
# mix, so a conda rename is not required.
placo = "==0.9.23"
ndcurves = "==2.3.0"
ros-jazzy-ruckig = ">=0.9.2,<0.10"
# RT controller binaries. Do not overlay a local src/controller checkout.
ros-jazzy-manipulation-position-controllers = "==0.3.3"
ros-jazzy-joint-trajectory-controller-guard = "==0.2.0"
# Execution Manager binary.  Its interfaces live in the minimal default layer
# so an in-process policy provider does not need the full runtime.
ros-jazzy-execution-manager = "==0.2.0"
# pinocchio's CMake find_dependency(Qhull) requires the CLI tools under
# $PREFIX/bin (qhull, qconvex, …). Keep an explicit pin so installs that
# clobber/drop those binaries can be repaired by reinstalling this package.
qhull = "==2020.2"
# Meta package pulls planners, plugins (incl. simple-controller-manager),
# moveit-ros (move-group, visualization), setup-assistant (configs-utils), etc.
ros-jazzy-moveit = "*"

# ── Teleop input devices ─────────────────────────────────────────────────────
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
ros-jazzy-teleop-twist-joy = ">=2.6.5,<3"
ros-jazzy-joy-linux = ">=3.3.0,<4"

# ── Recording / visualization / debug ────────────────────────────────────────
# Episode recorder binary. Do not overlay a local src/recording checkout.
# ros-jazzy-episode-recorder = "==0.5.0"
ros-jazzy-foxglove-bridge = "*"
# Time-series debug outside RViz (ROS topic streaming plugins included).
ros-jazzy-plotjuggler-ros = "*"
ros-jazzy-rqt-action = ">=2.2.0,<3"
filelock = "*"

# ── Launch testing ───────────────────────────────────────────────────────────
ros-jazzy-launch-testing = "*"
ros-jazzy-launch-pytest = "*"
# franka_gripper (and similar) find_package this under BUILD_TESTING=ON.
ros-jazzy-ament-cmake-clang-format = "*"
ros-jazzy-kinematics-interface-kdl = "*"

# Workspace-owned runtime paths. Pixi defines PIXI_PROJECT_ROOT during
# `pixi run`, `pixi shell`, and `pixi shell-hook` activation.
[activation.env]
WORKSPACE_ROOT = "$PIXI_PROJECT_ROOT"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PIXI_PROJECT_ROOT/src/interfaces/rmi:$PYTHONPATH"

RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/.config/cyclonedds_default.xml"
ROS_DOMAIN_ID = "1"
MPLCONFIGDIR = "/tmp/physical_ai_matplotlib"
CMAKE_GENERATOR = "Ninja"

[feature.runtime.tasks]
setup = "bash scripts/setup.sh"
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release"
# --python-testing pytest: colcon's default Python testing step only picks
# pytest when a package's *exact* extracted test dependency name is
# `pytest`. ROS package.xml <test_depend> entries use the rosdep key
# `python3-pytest`, which never matches, so ament_python packages silently
# fall back to `python -m unittest` discovery and drop every pytest-style
# (non-unittest.TestCase) test with zero error output. Force pytest so
# ament_python test suites are actually collected and run.
test = "bash -c 'colcon test --python-testing pytest && colcon test-result --verbose'"
clean = "rm -rf build install log"
# Kill leftover ROS 2 processes (launch, CM, cameras, JTC guard, RViz, ...).
# Always restarts the ros2 daemon. STOP_ROS_REMOTE=1 also runs this script on
# the RT host (STOP_ROS_REMOTE_HOST, default gamma@192.168.1.102).
# On an RT host that only has the cpu env: pixi run -e cpu stop
stop = "bash scripts/stop_ros.sh"
# Time-series inspector (alongside / instead of RViz). Same ROS_DOMAIN_ID.
pj = "ros2 run plotjuggler plotjuggler"
format = "ruff format --no-cache src"
lint = "ruff check --no-cache src"

# Applications — parked until each is verified on runtime bringup.
# teleop = "python apps/teleop.py"
# record = "python apps/record.py"
# replay = "python apps/replay.py"
# eval = "python apps/eval.py"

# ── cuRobo / CUDA 13 feature ─────────────────────────────────────────────────
#
# Intentionally omitted as pypi (already provided by conda / transitive):
#   pin          -> pinocchio via placo / ros-jazzy-pinocchio
#   pyyaml       -> conda pyyaml (ROS stack)
#   scipy        -> conda scipy
#   msgpack      -> conda msgpack-python
#   cmeel-urdfdom / cmeel-tinyxml2 -> conda urdfdom (ROS/pinocchio);
#     keeping both only overwrites check_urdf / urdf_to_graphviz etc.
# Do not add numpy, opencv-python, or opencv-python-headless here.

[feature.curobo.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = [
    "https://pypi.nvidia.com",
    "https://download.pytorch.org/whl/cu130",
]
index-strategy = "unsafe-best-match"

[feature.curobo.pypi-dependencies]
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cu130" }
jax = { version = ">=0.11.0", extras = ["cuda13"] }
jax-cuda13-plugin = { version = ">=0.11.0", extras = ["with-cuda"] }

# Isaac Teleop (wheel URL avoids manylinux_2_28 vs NVIDIA manylinux_2_35 mismatch)
isaacteleop = { url = "https://pypi.nvidia.com/isaacteleop/isaacteleop-1.5.124rc1-cp312-cp312-manylinux_2_35_x86_64.whl" }
mcap = ">=1.2.0"
msgpack-numpy = "*"
nlopt = ">=2.8.0"
viser = ">=0.2.0"
websockets = ">=14.0"
daqp = "*"
loop-rate-limiters = "*"
pin-pink = "*"
dex-retargeting = "*"
toppra = "*"


# Motion planning backends (git-pinned; never live-query upstream HEAD)
# Bump pyroki: git ls-remote https://github.com/Gabriel-Ning/pyroki.git main
# then `pixi update pyroki` with PIXI_FROZEN unset.
pyroki = { git = "https://github.com/Gabriel-Ning/pyroki.git", rev = "388e43e1fc0d0ee382968d3dd72970fd62a0450c" }
# Bump curobo: git ls-remote https://github.com/Gabriel-Ning/curobo.git main
# then `pixi update nvidia-curobo` with PIXI_FROZEN unset.
nvidia-curobo = { git = "https://github.com/Gabriel-Ning/curobo.git", rev = "77c002b02aef02e634cbf9ddc3ea08ea8d9a64c3", extras = [
    "cu13-torch",
] }
# Runtime orchestration HTTP/WebSocket transport.
fastapi = ">=0.139.2, <0.140"
uvicorn = ">=0.51.0, <0.52"



[feature.curobo.activation.env]
CLOUDXR_DIR = "$PIXI_PROJECT_ROOT/.cloudxr"
CUDA_HOME = "$PIXI_PROJECT_ROOT/.pixi/envs/curobo/lib/python3.12/site-packages/nvidia/cu13"

[feature.curobo.tasks]
teleop-quest3 = "bash -c 'source install/setup.bash && ros2 launch isaacteleop_toolbox bimanual_target_live.launch.py'"
cloudxr-setup = "bash -c 'source install/setup.bash && ros2 run isaacteleop_toolbox isaacteleop-cloudxr-setup --cloudxr-dir \"$PIXI_PROJECT_ROOT/.cloudxr\"'"

# ── LeRobot / CUDA 12.8 feature ──────────────────────────────────────────────
# Release tuple validated by DockerSpaces@c5506dc097d9993ae855cd28cd7f52f1e1cea1c7:
#   LeRobot 97482f6, Python 3.12, Torch 2.11/cu128, flash-attn 2.8.3.
[feature.lerobot.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
# DockerSpaces installs the locked LeRobot stack, then deliberately restores
# safetensors 0.7.0.  Preserve that validated runtime ABI even though current
# diffusers metadata asks for >=0.8.
dependency-overrides = { safetensors = "==0.7.0" }

[feature.lerobot.dependencies]
# LeRobot inherits only the minimal ROS provider layer.  Full ROS desktop,
# OpenCV, PlotJuggler, MoveIt runtime, and conda placo remain in `runtime`.
packaging = ">=24.2,<26"
numpy = ">=2.0,<2.3"
setuptools = ">=71,<82"
protobuf = ">=6.31.1,<=6.32.0"
cmake = ">=3.29,<4"
ninja = "*"
ros-jazzy-rosbag2-py = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
# hf-egl-probe (pulled by the `all` extra) hard-codes `make -j` in setup.py.
make = "*"
cuda-toolkit = "12.8.*"
# Prefer conda-forge's cp312 binary.  The PyPI sdist generates ecodes against
# the host kernel headers and can then fail against the Pixi sysroot headers.
evdev = "==2.0.0"

[feature.lerobot.activation.env]
# hf-egl-probe invokes `cmake ..; make -j` directly and is incompatible with
# the workspace-wide Ninja generator used by the ROS build environments.
CMAKE_GENERATOR = "Unix Makefiles"

[feature.lerobot.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu128" }
# Dao-AILab does not publish a cp312 / Torch 2.11 wheel for v2.8.3.  Use the
# community wheel linked from upstream issue #2425; its cu12 / CXX11 ABI tuple
# matches torch 2.11.0+cu128 in this solve group.
flash-attn = { url = "https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.11/flash_attn-2.8.3%2Bcu12torch2.11cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
safetensors = "==0.7.0"
lerobot = { git = "https://github.com/Gabriel-Ning/lerobot.git", rev = "97482f665dfb6937d8e48355c8293791104ae654", extras = ["all"] }

[feature.lerobot.tasks]
lerobot-versions = "python -c \"import flash_attn, lerobot, torch, torchvision; print(f'lerobot={lerobot.__version__} torch={torch.__version__} torchvision={torchvision.__version__} cuda={torch.version.cuda} flash_attn={flash_attn.__version__}')\""

[environments]
# default is the previous cpu robot stack. `runtime` is the same feature set
# under an explicit name. `cpu` keeps RT-host docs (`pixi run -e cpu setup`).
default = { features = ["runtime"], solve-group = "runtime" }
runtime = { features = ["runtime"], solve-group = "runtime" }
cpu = { features = ["runtime"], solve-group = "runtime" }
curobo = { features = ["runtime", "curobo"], solve-group = "curobo" }
lerobot = { features = ["lerobot"], solve-group = "lerobot" }
