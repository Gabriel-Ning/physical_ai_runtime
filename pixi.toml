[workspace]
name = "physical-ai-runtime"
version = "0.1.0"
description = "Piper RT-host ROS 2 Jazzy workspace"
authors = ["Gabriel-Ning <guomning@gmail.com>"]
channels = [
    "robostack-jazzy",
    "https://prefix.dev/gabriel-robotics",
    "conda-forge",
]
platforms = [{ platform = "linux-64", glibc = "2.35" }]

# Single environment: Piper real-hardware RT stack.
# Controllers / JTC guard come from gabriel-robotics binaries.
# Robot packages are src/embodiments/robots/piper + src/bringup.

[dependencies]
python = "3.12.*"
pyyaml = "*"

ros-jazzy-ros-core = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-action-msgs = "*"
ros-jazzy-control-msgs = "*"
ros-jazzy-controller-manager-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-trajectory-msgs = "*"
ros-jazzy-tf2-msgs = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-ros-py = "*"

colcon-common-extensions = "*"
pytest = ">=8,<9"

cmake = "*"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
sysroot_linux-64 = ">=2.39"
patchelf = "*"
eigen = "*"

ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-ros2-control-cmake = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-kinematics-interface-kdl = "*"

libpiper = "0.5.0.*"
placo = "==0.9.23"
ndcurves = "==2.3.0"
ros-jazzy-ruckig = ">=0.9.2,<0.10"
ros-jazzy-manipulation-position-controllers = "==0.3.7"
ros-jazzy-joint-trajectory-controller-guard = "==0.2.1"
qhull = "==2020.2"

ros-jazzy-launch-testing = "*"
ros-jazzy-launch-pytest = "*"
ros-jazzy-ament-cmake-pytest = "*"

[activation.env]
WORKSPACE_ROOT = "$PIXI_PROJECT_ROOT"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PYTHONPATH"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/.config/cyclonedds_default.xml"
ROS_DOMAIN_ID = "1"
# Jazzy defaults to LOCALHOST, which hides RT topics from the workstation.
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"
CMAKE_GENERATOR = "Ninja"

[tasks]
setup = "bash scripts/setup.sh"
setup-rt = "bash -c 'bash scripts/setup_cpu_rt_host.sh \"$@\"' --"
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release"
test = "bash -c 'colcon test --python-testing pytest && colcon test-result --verbose'"
clean = "rm -rf build install log"
stop = "bash scripts/stop_ros.sh"
rt-piper = "bash -c 'source install/setup.bash && ros2 launch piper_manipulation_rt_launch rt_stack.launch.py \"$@\"' --"
