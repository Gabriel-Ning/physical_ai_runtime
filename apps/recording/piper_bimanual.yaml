  - {id: trace_planner_left_arm_feedback, topic: /execution_trace/planner/left_arm/joint_trajectory/feedback, expected_type: execution_manager_interfaces/msg/TrajectoryExecutionFeedback, required: false, start_gate: false, qos: {mode: explicit, reliability: best_effort, durability: volatile, depth: 10}}
  - {id: trace_planner_right_arm_events, topic: /execution_trace/planner/right_arm/joint_trajectory/events, expected_type: execution_manager_interfaces/msg/TrajectoryExecutionEvent, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_planner_right_arm_feedback, topic: /execution_trace/planner/right_arm/joint_trajectory/feedback, expected_type: execution_manager_interfaces/msg/TrajectoryExecutionFeedback, required: false, start_gate: false, qos: {mode: explicit, reliability: best_effort, durability: volatile, depth: 10}}
  - {id: execution_left_arm, topic: /execution/left_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: execution_right_arm, topic: /execution/right_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
