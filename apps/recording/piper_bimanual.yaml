  - {id: robot_joint_states, topic: /joint_states, expected_type: sensor_msgs/msg/JointState, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: static_orbbec_color, topic: /observation/static_orbbec/color/image_raw, expected_type: sensor_msgs/msg/Image, required: false, start_gate: false, qos: {mode: sensor_data}}
  - {id: left_wrist_realsense_color, topic: /observation/left_hand_realsense/color/image_raw, expected_type: sensor_msgs/msg/Image, required: false, start_gate: false, qos: {mode: sensor_data}}
