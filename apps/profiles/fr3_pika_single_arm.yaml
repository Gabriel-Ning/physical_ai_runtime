metadata:
  name: "fr3_pika_single_arm"
  embodiment_type: "single_arm"
  vendor: "franka"
  version: "1.0"

host_roles:
  rt_host:
    bringup:
      package: "franka_manipulation_rt_launch"
      launch_file: "rt_stack.launch.py"
      arguments:
        use_fake_hardware: true
        use_rviz: false
    owns: ["ros2_control", "local_safety"]
  workstation_host:
    bringup:
      package: "franka_manipulation_workstation_launch"
      launch_file: "franka_workstation.launch.py"
      arguments:
        with_execution_manager: true
        with_recorder: true
        max_command_age_s: 0.25
    owns: ["rmi", "execution_manager", "action_provider_nodes", "application_nodes", "episode_recorder_client"]

groups:
  arm:
    type: "arm"
    joint_names: ["fr3_joint1", "fr3_joint2", "fr3_joint3", "fr3_joint4", "fr3_joint5", "fr3_joint6", "fr3_joint7"]
    base_frame: "fr3_link0"
    flange_frame: "fr3_link8"
    tcp_frame: "pika_gripper_tcp"
    controller_manager: "/controller_manager"
    default_controller: "joint_trajectory"
    controllers:
      joint_trajectory:
        name: "franka_arm_jtc"
        implementation: "joint_trajectory_controller/JointTrajectoryController"
        command_interface: "effort"
        ros_actions:
          follow_joint_trajectory: "/execution/arm/follow_joint_trajectory"
        ros_topics:
          trajectory_guard_heartbeat: "/execution/arm/trajectory_guard_heartbeat"
      joint_space_reference:
        name: "franka_arm_jsic"
        implementation: "manipulation_position_controllers/JointSpaceImpedanceController"
        command_interface: "effort"
        ros_topics:
          joint_reference: "/execution/arm/joint_reference"
      task_space_reference:
        name: "franka_arm_tsjic"
        implementation: "manipulation_position_controllers/TaskSpaceJointImpedanceController"
        command_interface: "effort"
        ros_topics:
          pose_reference: "/execution/arm/pose_reference"
          twist_reference: "/execution/arm/twist_reference"

  end_effector:
    type: "parallel_gripper"
    joint_names: ["gripper_left_joint"]
    parent_group: "arm"
    base_frame: "fr3_link8"
    tcp_frame: "pika_gripper_tcp"
    controller_manager: "/controller_manager"
    default_controller: "joint_space_reference"
    controllers:
      joint_space_reference:
        name: "pika_gripper_fwd"
        implementation: "forward_command_controller/ForwardCommandController"
        command_interface: "position"
        ros_topics:
          joint_reference: "/execution/end_effector/joint_reference"

compound_groups:
  manipulator:
    included_groups: ["arm", "end_effector"]

agents:
  Policy:
    source_role: POLICY
    resources: {arm: joint_reference, end_effector: joint_reference}
    frequency: 30.0
  Planner:
    source_role: PLANNER
    resources: {arm: joint_trajectory}
    frequency: 30.0
  TeleopJoint:
    source_role: TELEOP
    resources: {arm: joint_reference, end_effector: joint_reference}
    frequency: 30.0
  TeleopCartesian:
    source_role: TELEOP
    resources: {arm: pose_reference}
    frequency: 30.0
  TeleopTwist:
    source_role: TELEOP
    resources: {arm: twist_reference}
    frequency: 30.0

sensors:
  cameras:
    wrist_d405:
      ros_topic: "/pika_d405/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    wrist_d405_depth:
      ros_topic: "/pika_d405/camera/depth/image_rect_raw"
      encoding: "16UC1"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    wrist_fisheye:
      ros_topic: "/pika_fisheye/image/compressed"
      encoding: "jpeg"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"

recorder:
  profile: "rmi_fr3_policy"
  root_dir: "data/episodes"
  experiment_name: "fr3_pika_policy"
  task: "pika_manipulation_demo"

features:
  observation:
    "observation.images.wrist_d405":
      type: "image"
      shape: [3, 480, 848]
      source: "sensors.cameras.wrist_d405"
    "observation.images.wrist_fisheye":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.wrist_fisheye"
    "observation.state":
      type: "vector"
      shape: [8]
      units: "rad"
  action:
    "action":
      type: "vector"
      shape: [8]
      command_contract: "joint_reference"
