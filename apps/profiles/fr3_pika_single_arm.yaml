metadata:
  name: "fr3_pika_single_arm"
  embodiment_type: "single_arm"
  vendor: "franka"
  version: "1.0"

# Routing table lives in the workstation EM config. RMI only consumes it.
execution_manager_config:
  package: "franka_manipulation_workstation_launch"
  file: "config/execution_manager.yaml"

compound_groups:
  manipulator:
    included_groups: ["arm", "end_effector"]

nodes:
  DummyPolicy:
    source_role: POLICY
    resources: {arm: joint_reference}
    frequency: 100.0
  Policy:
    source_role: POLICY
    resources: {arm: joint_reference, end_effector: joint_reference}
    frequency: 30.0
  Replay:
    source_role: MEMORY
    resources: {arm: joint_reference, end_effector: joint_reference}
    frequency: 30.0
  Planner:
    source_role: PLANNER
    resources: {arm: joint_trajectory, end_effector: gripper_command}
    frequency: 30.0
  TeleopJoint:
    source_role: TELEOP
    resources: {arm: joint_reference, end_effector: joint_reference}
    frequency: 30.0
  TeleopCartesian:
    source_role: TELEOP
    resources: {arm: pose_reference}
    frequency: 30.0
  TeleopTwist:
    source_role: TELEOP
    resources: {arm: twist_reference}
    frequency: 30.0
  GamepadTeleop:
    source_role: TELEOP
    resources: {arm: twist_reference, end_effector: joint_reference}
    frequency: 100.0

sensors:
  # Wrist stream size/rate live in
  # src/bringup/franka_manipulation/rt_launch/config/camera/pika_cameras.yaml
  # (RT host: one FR3 + one Pika cable — gripper, fisheye, D405).
  # Hikvision (7 cams on workstation): deferred.
  cameras:
    wrist_d405:
      ros_topic: "/pika_d405/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    wrist_d405_depth:
      ros_topic: "/pika_d405/camera/aligned_depth_to_color/image_raw"
      encoding: "16UC1"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    wrist_fisheye:
      ros_topic: "/pika_fisheye/image/compressed"
      encoding: "jpeg"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"

homing:
  duration_s: 8.0
  # Captured by joint name from /joint_states at the Franka fake-hardware
  # initial pose on 2026-08-30.
  joint_positions:
    arm: [0.0, -0.7853981633974483, 0.0, -2.356194490192345,
          0.0, 1.5707963267948966, 0.7853981633974483]
    end_effector: [0.0]

# The application selects the stream contract injected during recorder PREPARE.
recorder:
  config: "../recording/franka_manipulation_no_cam.yaml"
  root_dir: "data/episodes"
  experiment_name: "fr3_pika_policy"
  task: "pika_manipulation_demo"
  episodes: 5
  rate_hz: 30.0
  max_duration_s: 60.0

features:
  observation:
    "observation.images.wrist_d405":
      type: "image"
      shape: [3, 480, 848]
      source: "sensors.cameras.wrist_d405"
    "observation.images.wrist_fisheye":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.wrist_fisheye"
    "observation.state":
      type: "vector"
      shape: [8]
      units: "rad"
  action:
    "action":
      type: "vector"
      shape: [8]
      command_contract: "joint_reference"
