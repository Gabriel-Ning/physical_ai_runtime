metadata:
  name: "piper_bimanual"
  embodiment_type: "bimanual"
  vendor: "piper"
  version: "1.0"

host_roles:
  rt_host:
    bringup:
      package: "piper_manipulation_rt_launch"
      launch_file: "rt_stack.launch.py"
      arguments:
        use_fake_hardware: false
        use_rviz: false
        left_can_interface: piper0
        right_can_interface: piper1
    owns: ["ros2_control", "local_safety"]
  workstation_host:
    bringup:
      package: "piper_manipulation_workstation_launch"
      launch_file: "workstation_stack.launch.py"
    owns: ["sensors", "teleoperators", "rmi", "execution_manager", "action_provider_nodes", "application_nodes", "episode_recorder_client"]

# Execution capability and command routes are owned by the workstation package.
execution_manager_config:
  package: "piper_manipulation_workstation_launch"
  file: "config/execution_manager.yaml"

compound_groups:
  left_manipulator:
    included_groups: ["left_arm", "left_gripper"]
  right_manipulator:
    included_groups: ["right_arm", "right_gripper"]
  dual_arm:
    included_groups: ["left_arm", "right_arm"]
  dual_manipulator:
    included_groups: ["left_arm", "left_gripper", "right_arm", "right_gripper"]

agents:
  Policy:
    source_role: POLICY
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 30.0
  Planner:
    source_role: PLANNER
    resources: {left_arm: joint_trajectory, right_arm: joint_trajectory}
    frequency: 30.0
  TeleopJoint_Left:
    source_role: TELEOP
    resources: {left_arm: joint_reference, left_gripper: joint_reference}
    frequency: 200.0
  TeleopJoint_Right:
    source_role: TELEOP
    resources: {right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 200.0
  TeleopCartesian_Left:
    source_role: TELEOP
    resources: {left_arm: pose_reference}
    frequency: 100.0
  TeleopCartesian_Right:
    source_role: TELEOP
    resources: {right_arm: pose_reference}
    frequency: 100.0
  TeleopTwist_Left:
    source_role: TELEOP
    resources: {left_arm: twist_reference}
    frequency: 100.0
  TeleopTwist_Right:
    source_role: TELEOP
    resources: {right_arm: twist_reference}
    frequency: 100.0

sensors:
  cameras:
    static_orbbec:
      ros_topic: "/observation/static_orbbec/color/image_raw"
    left_wrist_cam:
      ros_topic: "/observation/left_hand_realsense/color/image_raw"
    right_wrist_cam:
      ros_topic: "/observation/right_hand_realsense/color/image_raw"

recorder:
  config:
    package: "piper_manipulation_workstation_launch"
    file: "config/recording/rmi_piper_bimanual.yaml"
  root_dir: "data/episodes"
  experiment_name: "bimanual_manipulation"
  task: "bimanual_manipulation"
  episodes: 5
  rate_hz: 50.0
  max_duration_s: 60.0
  homing_duration_s: 2.5
  home_pose: [0.0, 0.5, -0.5, 0.0, 0.0, 0.0]

teleoperators:
  left_leader:
    target_agent: "TeleopJoint_Left"
    arm_part: "left_arm"
    gripper_part: "left_gripper"
    arm_source: "/action_sources/piper_leader_left/arm/joint_reference"
    gripper_source: "/action_sources/piper_leader_left/end_effector/joint_reference"
    preempt_service: "/piper_leader_left/preempt"
  right_leader:
    target_agent: "TeleopJoint_Right"
    arm_part: "right_arm"
    gripper_part: "right_gripper"
    arm_source: "/action_sources/piper_leader_right/arm/joint_reference"
    gripper_source: "/action_sources/piper_leader_right/end_effector/joint_reference"
    preempt_service: "/piper_leader_right/preempt"

features:
  observation:
    "observation.images.static_orbbec":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.static_orbbec"
    "observation.images.left_wrist_cam":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.left_wrist_cam"
    "observation.images.right_wrist_cam":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.right_wrist_cam"
    "observation.state":
      type: "vector"
      shape: [14]
      units: "rad"
  action:
    "action":
      type: "vector"
      shape: [14]
      command_contract: "joint_reference"
