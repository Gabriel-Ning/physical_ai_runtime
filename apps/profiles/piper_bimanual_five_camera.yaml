metadata:
  name: "piper_bimanual_five_camera"
  embodiment_type: "bimanual"
  vendor: "piper"
  version: "1.0"

host_roles:
  rt_host:
    bringup:
      package: "piper_manipulation_rt_launch"
      launch_file: "rt_stack.launch.py"
      arguments:
        use_fake_hardware: false
        use_rviz: false
        left_can_interface: piper1
        right_can_interface: piper0
    owns: ["ros2_control", "local_safety", "external_realsense_cameras"]
  workstation_host:
    bringup:
      package: "piper_manipulation_workstation_launch"
      launch_file: "five_camera_workstation.launch.py"
    owns: ["orbbec_external_camera", "wrist_cameras", "teleoperators", "rmi", "execution_manager", "episode_recorder_client"]

execution_manager_config:
  package: "piper_manipulation_workstation_launch"
  file: "config/execution_manager.yaml"

compound_groups:
  left_manipulator:
    included_groups: ["left_arm", "left_gripper"]
  right_manipulator:
    included_groups: ["right_arm", "right_gripper"]
  dual_arm:
    included_groups: ["left_arm", "right_arm"]
  dual_manipulator:
    included_groups: ["left_arm", "left_gripper", "right_arm", "right_gripper"]

agents:
  Policy:
    source_role: POLICY
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 30.0
  TeleopJoint_Left:
    source_role: TELEOP
    resources: {left_arm: joint_reference, left_gripper: joint_reference}
    frequency: 200.0
  TeleopJoint_Right:
    source_role: TELEOP
    resources: {right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 200.0

sensors:
  cameras:
    orbbec:
      ros_topic: "/observation/orbbec/color/image_raw"
    d435i1:
      ros_topic: "/observation/d435i1/color/image_raw"
    d435i2:
      ros_topic: "/observation/d435i2/color/image_raw"
    left_wrist_cam:
      ros_topic: "/observation/left_hand_realsense/color/image_raw"
    right_wrist_cam:
      ros_topic: "/observation/right_hand_realsense/color/image_raw"

recorder:
  config:
    package: "piper_manipulation_workstation_launch"
    file: "config/recording/rmi_piper_bimanual_five_camera.yaml"
  root_dir: "data/episodes"
  experiment_name: "towel_corner_grasp_v1"
  task: "towel_corner_grasp_v1"
  dataset_version: "towel_corner_grasp_five_camera_v1"
  config_id: "act_multiview_screening_v1"
  camera_setup: "piper_five_camera_20260827"
  episodes: 100
  rate_hz: 50.0
  max_duration_s: 60.0
  homing_duration_s: 2.5
  home_pose: [0.0, 0.5, -0.5, 0.0, 0.0, 0.0]

teleoperators:
  left_leader:
    target_agent: "TeleopJoint_Left"
    arm_part: "left_arm"
    gripper_part: "left_gripper"
    arm_source: "/action_sources/piper_leader_left/arm/joint_reference"
    gripper_source: "/action_sources/piper_leader_left/end_effector/joint_reference"
    preempt_service: "/piper_leader_left/preempt"
  right_leader:
    target_agent: "TeleopJoint_Right"
    arm_part: "right_arm"
    gripper_part: "right_gripper"
    arm_source: "/action_sources/piper_leader_right/arm/joint_reference"
    gripper_source: "/action_sources/piper_leader_right/end_effector/joint_reference"
    preempt_service: "/piper_leader_right/preempt"

features:
  observation:
    "observation.images.external_1":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.orbbec"
    "observation.images.external_2":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.d435i1"
    "observation.images.external_3":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.d435i2"
    "observation.images.left_wrist":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.left_wrist_cam"
    "observation.images.right_wrist":
      type: "image"
      shape: [3, 480, 640]
      source: "sensors.cameras.right_wrist_cam"
    "observation.state":
      type: "vector"
      shape: [14]
      units: "rad"
  action:
    "action":
      type: "vector"
      shape: [14]
      command_contract: "joint_reference"
