metadata:
  # 【严禁修改】具身本体与工作台唯一标识，与底座硬件强绑定
  name: "marvin_bimanual"
  embodiment_type: "bimanual_humanoid"
  vendor: "marvin"
  version: "1.0"

# 【严禁修改】调度中枢入口，指向 workstation_launch 的 EM 路由配置
execution_manager_config:
  package: "marvin_manipulation_workstation_launch"
  file: "config/execution_manager.yaml"

# 【严禁修改】运动学逻辑分组（左右臂 + Pika 夹爪）
compound_groups:
  left_manipulator:
    included_groups: ["left_arm", "left_gripper"]
  right_manipulator:
    included_groups: ["right_arm", "right_gripper"]
  dual_arm:
    included_groups: ["left_arm", "right_arm"]
  dual_manipulator:
    included_groups: ["left_arm", "left_gripper", "right_arm", "right_gripper"]

# 【契约绑定】工作台支持的控制与示教通道目录（通道名称与 resources 必须严格与 EM sources 保持一致）
nodes:
  DummyPolicy:
    source_role: POLICY
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 100.0
  JointPolicy:
    source_role: POLICY
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 30.0
  CartesianPolicy:
    source_role: POLICY
    resources: {left_arm: pose_reference, left_gripper: joint_reference, right_arm: pose_reference, right_gripper: joint_reference}
    frequency: 30.0
  Replay:
    source_role: MEMORY
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 30.0
  TrajectoryPlanner:
    source_role: PLANNER
    resources: {left_arm: joint_trajectory, left_gripper: gripper_command, right_arm: joint_trajectory, right_gripper: gripper_command}
    # 备注：Action 式轨迹规划器为一次性调度 (One-shot)，frequency 仅作为 RMI 句柄判活心跳，非周期发布
    frequency: 30.0
  StreamingPlanner:
    source_role: PLANNER
    resources: {left_arm: joint_reference, left_gripper: joint_reference, right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 100.0
  TeleopTwist_Left:
    source_role: TELEOP
    resources: {left_arm: twist_reference, left_gripper: joint_reference}
    frequency: 100.0
  TeleopTwist_Right:
    source_role: TELEOP
    resources: {right_arm: twist_reference, right_gripper: joint_reference}
    frequency: 100.0
  TeleopCartesian_Left:
    source_role: TELEOP
    resources: {left_arm: pose_reference, left_gripper: joint_reference}
    frequency: 50.0
  TeleopCartesian_Right:
    source_role: TELEOP
    resources: {right_arm: pose_reference, right_gripper: joint_reference}
    frequency: 50.0
  TeleopJoint_Left:
    source_role: TELEOP
    resources: {left_arm: joint_reference, left_gripper: joint_reference}
    frequency: 100.0
  TeleopJoint_Right:
    source_role: TELEOP
    resources: {right_arm: joint_reference, right_gripper: joint_reference}
    frequency: 100.0

# 【硬件绑定】物理传感器拓扑（话题名、编码与底层硬件严格强绑定，严禁随意修改）
# Marvin 无 MuJoCo 默认栈；本文件即真机台架画像（见 site/marvin_bimanual_real.yaml）。
sensors:
  cameras:
    left_pika_d405:
      ros_topic: "/left_pika_d405/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    left_pika_fisheye:
      ros_topic: "/left_pika_fisheye/image/compressed"
      encoding: "jpeg"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"
    right_pika_d405:
      ros_topic: "/right_pika_d405/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [480, 848]
      qos_profile: "sensor_data"
    right_pika_fisheye:
      ros_topic: "/right_pika_fisheye/image/compressed"
      encoding: "jpeg"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"
    head_d435:
      ros_topic: "/head_d435/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"
    third_person_d435:
      ros_topic: "/third_person_d435/camera/color/image_raw"
      encoding: "rgb8"
      fps: 30
      resolution: [720, 1280]
      qos_profile: "sensor_data"

# ==============================================================================
# ↑ 【物理固定层 (Hardware Invariant)】
#   上方内容：与物理台架硬件强绑定，台架安装搭建确定后不可变更。
#   (metadata, execution_manager_config, compound_groups, nodes, sensors)
# ==============================================================================
# ↓ 【应用/实验可变层 (Task & Experiment Specific)】
#   下方内容：随具体采集实验、训练配置、任务类型按需调整或覆盖。
#   (homing, recorder 默认配置, features 数据集与特征定义)
# ==============================================================================

# 【可修改】机械臂归位安全姿态（真机 /joint_states 实测，按 part 键入，不依赖 JointState 顺序）
homing:
  duration_s: 8.0
  joint_positions:
    left_arm:
      [-1.0503277641628497, 1.2404911146950939, 1.566118084866009,
       -2.086290437405812, 0.48874412219966884, 0.09129618319127784,
       0.13037110635746443]
    left_gripper: [0.045]
    right_arm:
      [-2.0890998060397363, -1.1433997182018572, 1.526900108337393,
       -2.0866996321073024, -0.41910032916522466, 0.13079942588453322,
       -0.21079963654229344]
    right_gripper: [0.045]

# 【可修改】数据录制默认缺省参数（执行 apps/record.py 时可通过命令行参数动态覆盖）
recorder:
  config: "../../recording/marvin_bimanual_no_cam.yaml"
  root_dir: "data/episodes"
  experiment_name: "marvin_bimanual"
  task: "bimanual_manipulation"
  episodes: 5
  rate_hz: 30.0
  max_duration_s: 60.0

# 【可修改】策略模型与数据集特征映射（根据所训练模型的输入输出 Tensor Schema 调整）
features:
  observation:
    "observation.images.left_pika_d405":
      type: "image"
      shape: [3, 480, 848]
      source: "sensors.cameras.left_pika_d405"
    "observation.images.left_pika_fisheye":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.left_pika_fisheye"
    "observation.images.right_pika_d405":
      type: "image"
      shape: [3, 480, 848]
      source: "sensors.cameras.right_pika_d405"
    "observation.images.right_pika_fisheye":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.right_pika_fisheye"
    "observation.images.head_d435":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.head_d435"
    "observation.images.third_person_d435":
      type: "image"
      shape: [3, 720, 1280]
      source: "sensors.cameras.third_person_d435"
    "observation.state":
      type: "vector"
      shape: [16]
      units: "rad"
  action:
    "action":
      type: "vector"
      shape: [16]
      command_contract: "joint_reference"
      units: "rad"
      # 【核心约定】动作空间表达模式:
      # - "abs": 绝对目标动作 (Absolute: a_t = q_{target})
      # - "rel": 相对当前状态的动作增量 (Delta: Δa_t = q_{target} - q_{current})
      # 架构定则: 底层通信 (EM) 与控制器严禁接收累加增量，只接收绝对目标 (abs) 或速度 (twist)。
      # 若模型训练为 rel，推理端 (Policy Client) 必须在本地闭环积分转换后 (a_target = s_actual + Δa_rel) 提交至 EM。
      space: "abs"  # 可选: ["abs", "rel"]
