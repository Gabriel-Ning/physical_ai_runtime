quest3_bimanual_absolute_target:
  ros__parameters:
    profile_name: quest3_bimanual_absolute

    # Target topics
    left_output_topic: ~/left_pose_target
    right_output_topic: ~/right_pose_target
    left_gripper_output_topic: ~/left_gripper_target
    right_gripper_output_topic: ~/right_gripper_target
    left_gripper_joint_name: left_gripper_joint1
    right_gripper_joint_name: right_gripper_joint1
    gripper_min_width: 0.000
    gripper_max_width: 0.080
    gripper_speed_mps: 0.050
    require_clutch_for_gripper: false

    status_topic: ~/status
    clutch_topic: /teleop/quest3_bimanual/clutch

    # Snapshot and calibration topics
    left_snapshot_controller_topic: /teleop/quest3_bimanual/left_snapshot/controller_pose
    left_snapshot_ee_topic: /teleop/quest3_bimanual/left_snapshot/ee_pose
    right_snapshot_controller_topic: /teleop/quest3_bimanual/right_snapshot/controller_pose
    right_snapshot_ee_topic: /teleop/quest3_bimanual/right_snapshot/ee_pose

    output_frame: world
    left_tcp_frame: ""
    right_tcp_frame: ""
    left_target_frame: teleop_left_ee_target
    right_target_frame: teleop_right_ee_target

    # Quest3 controller mapping & calibration
    pose_source: grip
    calibrate_source: menu
    calibrate_threshold: 0.5
    enable_deadman: false
    deadman_source: squeeze
    deadman_threshold: 0.5
    require_both_deadman: false

    # 1:1 Absolute spatial scaling & dynamic thumbstick scale adjustment
    linear_scale: 1.0
    angular_scale: 1.0
    enable_dynamic_scale: true
    scale_step: 0.1
    min_scale: 0.1
    max_scale: 3.0

    # SE(3) One Euro Filter (zero latency when moving, zero jitter when stationary)
    filter_type: one_euro
    one_euro_min_cutoff: 1.0
    one_euro_beta: 0.007
    one_euro_d_cutoff: 1.0

    # Safety rate limits (anti-teleport & anti-glitch protection)
    max_linear_step_m: 0.05
    max_angular_step_rad: 0.25

    # Fixed OpenXR -> ROS basis change
    openxr_to_base_rotation_xyzw: [0.5, -0.5, -0.5, 0.5]

    # Default robot standby poses
    use_live_ee_as_home: true
    left_home_xyz: [0.30, 0.20, 0.20]
    left_home_xyzw: [0.0, 0.0, 0.0, 1.0]
    right_home_xyz: [0.30, -0.20, 0.20]
    right_home_xyzw: [0.0, 0.0, 0.0, 1.0]
