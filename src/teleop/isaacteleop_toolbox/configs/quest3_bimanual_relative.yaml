quest3_bimanual_target:
  ros__parameters:
    profile_name: quest3_bimanual_relative

    # Generic private topics. Embodiment bringup packages override these with
    # their Execution Manager source ingress topics.
    left_output_topic: ~/left_pose_target
    right_output_topic: ~/right_pose_target
    left_gripper_output_topic: ~/left_gripper_target
    right_gripper_output_topic: ~/right_gripper_target
    left_gripper_joint_name: left_gripper_joint1
    right_gripper_joint_name: right_gripper_joint1
    gripper_min_width: 0.000
    gripper_max_width: 0.040
    gripper_speed_mps: 0.025
    require_clutch_for_gripper: false
    status_topic: ~/status
    clutch_topic: /teleop/quest3_bimanual/clutch
    # Clutch snapshot topics: the controller pose and robot EE pose latched
    # at the most recent deadman-press transition, republished every cycle
    # (held constant) while active. Add these to an episode_recorder topic
    # list to capture the per-episode delta-math reference alongside targets.
    left_snapshot_controller_topic: /teleop/quest3_bimanual/left_snapshot/controller_pose
    left_snapshot_ee_topic: /teleop/quest3_bimanual/left_snapshot/ee_pose
    right_snapshot_controller_topic: /teleop/quest3_bimanual/right_snapshot/controller_pose
    right_snapshot_ee_topic: /teleop/quest3_bimanual/right_snapshot/ee_pose
    output_frame: world
    left_tcp_frame: ""
    right_tcp_frame: ""
    left_target_frame: teleop_left_ee_target
    right_target_frame: teleop_right_ee_target

    # Quest3 controller mapping. Use aim pose for ray-oriented validation;
    # relatch relative targets while both squeeze deadmen are held.
    pose_source: aim
    deadman_source: squeeze
    deadman_threshold: 0.5
    require_both_deadman: true

    # Retarget tuning: 1.0 is 1:1 for RViz / free-space validation.
    # For real robot hardware bringup, recommend starting at 0.3 for operator safety.
    linear_scale: 1.0
    angular_scale: 1.0
    lowpass_alpha: 0.35
    max_linear_step_m: 0.03
    max_angular_step_rad: 0.15

    # Fixed basis-change rotation from OpenXR axes (x-right, y-up, z-back) to
    # robot-base axes (x-front, y-left, z-up), applied to raw controller
    # poses before any delta math. Same convention constant as
    # unitreerobotics/televuer's R_ROBOT_OPENXR; assumes the operator faces
    # the robot's forward direction (no per-session external-tracker
    # calibration). quat = R.from_matrix([[0,0,-1],[-1,0,0],[0,1,0]]).as_quat()
    openxr_to_base_rotation_xyzw: [0.5, -0.5, -0.5, 0.5]
