metadata:
  name: "example_robot"
  embodiment_type: "single_arm"
  vendor: "example"
  version: "1.0"

groups:
  arm:
    type: "arm"
    joint_names: ["joint1", "joint2"]
    base_frame: "base_link"
    flange_frame: "tool0"
    tcp_frame: "tcp"
    controller_manager: "/controller_manager"
    default_controller: "joint_trajectory"
    controllers:
      joint_trajectory:
        name: "arm_jtc"
        implementation: "joint_trajectory_controller/JointTrajectoryController"
        command_interface: "position"
        ros_actions:
          follow_joint_trajectory: "/execution/arm/follow_joint_trajectory"
      joint_space_reference:
        name: "arm_jspc"
        implementation: "example_controllers/JointReferenceController"
        command_interface: "position"
        ros_topics:
          joint_reference: "/execution/arm/joint_reference"
      task_space_reference:
        name: "arm_tskpc"
        implementation: "example_controllers/TaskReferenceController"
        command_interface: "position"
        ros_topics:
          pose_reference: "/execution/arm/pose_reference"
          twist_reference: "/execution/arm/twist_reference"

agents:
  Policy:
    source_role: POLICY
    resources: {arm: joint_reference}
    frequency: 50.0
  Planner:
    source_role: PLANNER
    resources: {arm: joint_trajectory}
  Teleop:
    source_role: TELEOP
    resources: {arm: pose_reference}
    frequency: 100.0
