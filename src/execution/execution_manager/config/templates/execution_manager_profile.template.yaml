metadata: {name: example_robot, version: "2.0"}

# Maximum age of a leased envelope at admission, measured with the EM ROS clock.
max_command_age_s: 0.25

# Trusted process ingress and executable controller contracts live here.
sources:
  Planner:
    source_role: PLANNER
    preempt: true
    inputs:
      arm:
        command_contract: joint_trajectory
        action: /action_sources/planner/arm/follow_joint_trajectory
      gripper:
        command_contract: gripper_command
        action: /action_sources/planner/gripper/gripper_command
  Replay:
    source_role: MEMORY
    preempt: false
    inputs:
      arm:
        command_contract: joint_reference
        topic: /action_sources/replay/arm/joint_reference
      gripper:
        command_contract: joint_reference
        topic: /action_sources/replay/gripper/joint_reference

groups:
  arm:
    type: arm
    joint_names: [joint1, joint2]
    controller_manager: /controller_manager
    default_controller: joint_trajectory
    controllers:
      joint_trajectory:
        name: arm_jtc
        implementation: joint_trajectory_controller/JointTrajectoryController
        command_interface: position
        ros_actions: {follow_joint_trajectory: /execution/arm/follow_joint_trajectory}
        ros_topics: {trajectory_guard_heartbeat: /execution/arm/trajectory_guard_heartbeat}
      joint_space_reference:
        name: arm_jspc
        implementation: example_controllers/JointReferenceController
        command_interface: position
        ros_topics: {joint_reference: /execution/arm/joint_reference}
  gripper:
    type: parallel_gripper
    joint_names: [gripper_joint]
    controller_manager: /controller_manager
    default_controller: joint_space_reference
    controllers:
      joint_space_reference:
        name: gripper_fwd
        implementation: forward_command_controller/ForwardCommandController
        command_interface: position
        ros_topics: {joint_reference: /execution/gripper/joint_reference}
      gripper_command:
        name: gripper_action
        implementation: parallel_gripper_action_controller/GripperActionController
        command_interface: position
        ros_actions: {gripper_command: /execution/gripper/gripper_command}
