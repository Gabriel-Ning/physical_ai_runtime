schema_version: 1

context:
  version: "0.2.1"

package:
  name: ros-jazzy-execution-manager
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  script: build.sh
  files:
    - lib/execution_manager/execution_manager
    - lib/execution_manager/execution_manager_node
    - share/ament_index/resource_index/package_run_dependencies/execution_manager
    - share/ament_index/resource_index/packages/execution_manager
    - share/execution_manager/CHANGELOG.rst
    - share/execution_manager/LICENSE
    - share/execution_manager/README.md
    - share/execution_manager/config/**
    - share/execution_manager/launch/*.py
    - share/execution_manager/package.xml

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-action-msgs
    - ros-jazzy-control-msgs
    - ros-jazzy-controller-manager-msgs
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-execution-manager-interfaces >=0.2.0
    - ros-jazzy-geometry-msgs
    - ros-jazzy-moveit-msgs
    - ros-jazzy-rcl-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-std-msgs
    - ros-jazzy-trajectory-msgs
    - ros-jazzy-yaml-cpp-vendor
    - yaml-cpp
  run:
    - ros-jazzy-action-msgs
    - ros-jazzy-control-msgs
    - ros-jazzy-controller-manager-msgs
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-execution-manager-interfaces >=0.2.0
    - ros-jazzy-geometry-msgs
    - ros-jazzy-launch-ros
    - ros-jazzy-moveit-msgs
    - ros-jazzy-rcl-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-ros2run
    - ros-jazzy-std-msgs
    - ros-jazzy-trajectory-msgs
    - ros-jazzy-yaml-cpp-vendor
    - yaml-cpp

tests:
  - package_contents:
      files:
        exists:
          - lib/execution_manager/execution_manager_node
          - share/ament_index/resource_index/packages/execution_manager
          - share/execution_manager/launch/execution_manager.launch.py
          - share/execution_manager/package.xml
        not_exists:
          - include/execution_manager/**
          - share/execution_manager/cmake/**
          - "**/*.cpp"
          - "**/*.hpp"
  - script:
      - test -x "$PREFIX/lib/execution_manager/execution_manager_node"
      - test -x "$PREFIX/lib/execution_manager/execution_manager"
      - test ! -d "$PREFIX/include/execution_manager"
      - test ! -d "$PREFIX/share/execution_manager/cmake"

about:
  homepage: https://github.com/Gabriel-Ning/execution_manager
  repository: https://github.com/Gabriel-Ning/execution_manager
  license: Apache-2.0
  license_file: LICENSE
  summary: Binary ROS 2 Jazzy graph-wide dynamic authority execution manager daemon
  description: |
    Runtime distribution of execution_manager. C++ implementation sources,
    public headers, tests, and CMake development exports are excluded.

extra:
  maintainers:
    - Gabriel-Ning
