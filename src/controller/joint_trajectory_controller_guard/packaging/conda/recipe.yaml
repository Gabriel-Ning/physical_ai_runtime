schema_version: 1

context:
  version: "0.1.0"

package:
  name: ros-jazzy-joint-trajectory-controller-guard
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  script: build.sh
  files:
    - lib/joint_trajectory_controller_guard/jtc_guard_node
    - share/ament_index/resource_index/packages/joint_trajectory_controller_guard
    - share/joint_trajectory_controller_guard/config/jtc_guard.yaml
    - share/joint_trajectory_controller_guard/launch/jtc_guard.launch.py
    - share/joint_trajectory_controller_guard/package.xml

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - ros-jazzy-action-msgs
    - ros-jazzy-ament-cmake
    - ros-jazzy-control-msgs
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-diagnostic-updater
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-std-msgs
  run:
    - ros-jazzy-action-msgs
    - ros-jazzy-control-msgs
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-diagnostic-updater
    - ros-jazzy-launch
    - ros-jazzy-launch-ros
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-std-msgs

tests:
  - package_contents:
      files:
        exists:
          - lib/joint_trajectory_controller_guard/jtc_guard_node
          - share/ament_index/resource_index/packages/joint_trajectory_controller_guard
          - share/joint_trajectory_controller_guard/config/jtc_guard.yaml
          - share/joint_trajectory_controller_guard/launch/jtc_guard.launch.py
          - share/joint_trajectory_controller_guard/package.xml
        not_exists:
          - include/joint_trajectory_controller_guard/**
          - "**/*.cpp"
          - "**/*.hpp"
  - script:
      - test -x "$PREFIX/lib/joint_trajectory_controller_guard/jtc_guard_node"
      - test -z "$(ldd -r "$PREFIX/lib/joint_trajectory_controller_guard/jtc_guard_node" 2>&1 | grep 'undefined symbol')"
      - test ! -d "$PREFIX/include/joint_trajectory_controller_guard"

about:
  homepage: https://github.com/Gabriel-Ning/phy_ai_runtime_controllers
  repository: https://github.com/Gabriel-Ning/phy_ai_runtime_controllers
  license: Apache-2.0
  license_file: LICENSE
  summary: Binary-only RT-host liveness guard for ROS 2 JointTrajectoryController
  description: |
    Watches a workstation-owned heartbeat while a FollowJointTrajectory
    session is active and cancels goals on the configured local JTC action
    server when supervision is lost. The runtime reports typed faults through
    standard ROS diagnostics and delegates deceleration and hold to JTC.

extra:
  maintainers:
    - Gabriel-Ning
