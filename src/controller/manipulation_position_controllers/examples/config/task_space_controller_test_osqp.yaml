controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    task_space_kinematic_position_controller:
      type: manipulation_position_controllers/TaskSpaceKinematicPositionController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 500.0

task_space_kinematic_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    base_frame: base_link
    tip_frame: flange_link
    pose_topic: /test/pose_reference
    stale_timeout_s: 0.5
    max_joint_velocity_rad_s: 1.0
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    max_command_tracking_error_rad: 0.35
    status_rate_hz: 10.0

    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

      # OSQP-only tuning (defaults shown). cbf_gain is robot- and
      # limit-margin-dependent -- do not assume the default fits your robot.
      osqp:
        max_admm_iterations: 200
        cbf_gain: 2.0
        slack_penalty: 1.0e4
        abs_tolerance: 1.0e-6
        rel_tolerance: 1.0e-6
        rho: 0.1

    lower_limits: []
    upper_limits: []
