# TaskSpaceKinematicPositionController configuration.
#
# Exactly two command inputs (JSPC parity for pose):
#   input_topic  ← moveit_msgs/CartesianTrajectory (1 pt ≡ old PoseStamped)
#   twist_topic  ← geometry_msgs/TwistStamped (optional)
#
# Backends: "pinocchio_dls" (Pinocchio FK + Jacobian + damped least-squares),
#           "osqp" (explicit 6D QP), "placo" (PlaCo task-stack QP).

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    task_space_kinematic_position_controller:
      type: manipulation_position_controllers/TaskSpaceKinematicPositionController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 500.0

task_space_kinematic_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    base_frame: base_link
    tip_frame: flange_link

    # CartesianTrajectory pose input (required). 1 point = single EE pose.
    input_topic: /execution/pose_reference
    reject_zero_stamped_references: true

    trajectory_behavior:
      max_points: 64
      # Ingest spacing for untimed (all-zero time_from_start) messages.
      # Present consume strategy ignores timing and uses point 0 only;
      # richer modes belong here later.
      untimed_frame_dt_s: 0.02

    # Optional TwistStamped input. Empty means disabled.
    twist_topic: ""

    stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.0
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    max_command_tracking_error_rad: 0.35
    status_rate_hz: 10.0

    solver:
      backend: pinocchio_dls
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    lower_limits: []
    upper_limits: []
