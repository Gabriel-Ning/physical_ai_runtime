controller_manager:
  ros__parameters:
    joint_space_position_controller:
      type: manipulation_position_controllers/JointSpacePositionController

joint_space_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # Single JointTrajectory input topic (per EXECUTION_MANAGER_M1_HANDOFF.md §3).
    input_topic: /execution/joint_reference
    input_qos_depth: 10  # subscription queue depth (QoS reliability is best-effort, fixed)

    trajectory_behavior:
      mode: limiter                # "limiter" (EMA + rate limiter) or "ruckig" (jerk-bounded OTG)
      max_points: 64               # max trajectory points buffered (1–64)
      stale_timeout_s: 0.5         # hold current command when no new reference arrives
      max_velocity_rad_s: 1.5      # per-joint velocity limit
      max_acceleration_rad_s2: 3.0 # per-joint acceleration limit
      ema_alpha: 0.2               # EMA smoothing (limiter mode only; 0 = no smoothing)
      max_jerk_rad_s3: 10.0        # per-joint jerk limit (ruckig mode only)
      ruckig_control_cycle_s: 0.002 # Ruckig OTG timestep, normally 1 / controller_manager.update_rate

    # Publish rate for ~/commanded_joint_state and ~/status (observability
    # only, not the realtime control loop).
    status_rate_hz: 10.0

    # Reject (vs. clamp) references with positions outside lower_limits/upper_limits.
    reject_out_of_bounds_targets: false

    # Accept JointTrajectory messages that only specify a subset of joints.
    # Missing joints hold their current position.  Default: true.
    allow_partial_joint_references: true

    # Reject JointTrajectory messages whose header.stamp is zero (no clock source).
    reject_zero_stamped_references: true

    # Per-joint position limits in radians. Empty → unbounded (±inf).
    # Replace with your robot's limits, e.g. for a 6-DOF arm:
    # lower_limits: [-2.618, -2.269, -2.356, -2.269, -1.571, -3.142]
    # upper_limits: [ 2.618,  2.269,  2.356,  2.269,  1.571,  3.142]
    lower_limits: []
    upper_limits: []
