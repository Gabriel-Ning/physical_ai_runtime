# TaskSpaceJointImpedanceController —
# input_topic (CartesianTrajectory) / twist_topic (TwistStamped)
#   → Diff-IK → joint impedance → effort.
#
# Present: command trajectory point 0 only (trajectory_behavior first_point).
# Distinct from a future TaskSpaceCartesianImpedanceController
# (operational-space / Cartesian stiffness).
# Replace joints / frames / gains for your robot. Franka bringup overrides these.

controller_manager:
  ros__parameters:
    task_space_joint_impedance_controller:
      type: manipulation_position_controllers/TaskSpaceJointImpedanceController

task_space_joint_impedance_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

    base_frame: base_link
    tip_frame: flange_link
    input_topic: /execution/pose_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      max_points: 64
      untimed_frame_dt_s: 0.02
    # Optional TwistStamped input. Empty means disabled.
    twist_topic: ""

    stale_timeout_s: 0.2
    twist_stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.5
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    status_rate_hz: 10.0
    # velocity_filter_alpha: measurement weight in (1-α)·prev + α·meas (1.0 = no filter).
    velocity_filter_alpha: 0.99

    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    kp_stiffness: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
    kd_damping: [30.0, 30.0, 30.0, 30.0, 10.0, 10.0, 5.0]
    max_torques: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
    max_torque_rates: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]

    lower_limits: []
    upper_limits: []
