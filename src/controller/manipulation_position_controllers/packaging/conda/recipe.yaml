schema_version: 1

context:
  version: "0.3.1"

package:
  name: ros-jazzy-manipulation-position-controllers
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  script: build.sh
  files:
    - lib/libmanipulation_position_controllers.so
    - lib/manipulation_position_controllers/*.so
    - share/ament_index/resource_index/controller_interface__pluginlib__plugin/manipulation_position_controllers
    - share/ament_index/resource_index/packages/manipulation_position_controllers
    - share/manipulation_position_controllers/config/*.yaml
    - share/manipulation_position_controllers/manipulation_position_controllers.xml
    - share/manipulation_position_controllers/package.xml

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - patchelf
  host:
    - eigen
    # Keep this pair exact: OsqpEigen 0.10.3 uses the OSQP 1.0 C API.
    # MoveIt's osqp_vendor provides an older, incompatible libosqp ABI.
    - libosqp ==1.0.0
    - osqp-eigen ==0.10.3
    - placo ==0.9.23
    - ros-jazzy-ament-cmake
    - ros-jazzy-control-toolbox
    - ros-jazzy-controller-interface
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-diagnostic-updater
    - ros-jazzy-geometry-msgs
    - ros-jazzy-hardware-interface
    - ros-jazzy-moveit-msgs
    - ros-jazzy-pinocchio
    - ros-jazzy-pluginlib
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-lifecycle
    - ros-jazzy-realtime-tools
    - ros-jazzy-ruckig
    - ros-jazzy-sensor-msgs
    - ros-jazzy-std-msgs
    - ros-jazzy-trajectory-msgs
  run:
    - libqdldl >=0.1.8,<0.1.9
    - placo ==0.9.23
    - ros-jazzy-control-toolbox
    - ros-jazzy-controller-interface
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-diagnostic-updater
    - ros-jazzy-geometry-msgs
    - ros-jazzy-hardware-interface
    - ros-jazzy-moveit-msgs
    - ros-jazzy-pinocchio
    - ros-jazzy-pluginlib
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-lifecycle
    - ros-jazzy-realtime-tools
    - ros-jazzy-ruckig
    - ros-jazzy-sensor-msgs
    - ros-jazzy-std-msgs
    - ros-jazzy-trajectory-msgs
  ignore_run_exports:
    from_package:
      - libosqp
      - osqp-eigen

tests:
  - package_contents:
      files:
        exists:
          - lib/libmanipulation_position_controllers.so
          - lib/manipulation_position_controllers/libmpc_osqp.so
          - lib/manipulation_position_controllers/libmpc_osqp_eigen.so
          - share/ament_index/resource_index/controller_interface__pluginlib__plugin/manipulation_position_controllers
          - share/manipulation_position_controllers/manipulation_position_controllers.xml
          - share/manipulation_position_controllers/config/joint_space_position_controller.yaml
          - share/manipulation_position_controllers/config/joint_space_impedance_controller.yaml
          - share/manipulation_position_controllers/config/task_space_kinematic_position_controller.yaml
          - share/manipulation_position_controllers/config/task_space_joint_impedance_controller.yaml
        not_exists:
          - include/manipulation_position_controllers/**
          - share/manipulation_position_controllers/cmake/**
          - "**/*.cpp"
          - "**/*.hpp"
  - script:
      - test -f "$PREFIX/lib/libmanipulation_position_controllers.so"
      - test -f "$PREFIX/lib/manipulation_position_controllers/libmpc_osqp.so"
      - test -f "$PREFIX/lib/manipulation_position_controllers/libmpc_osqp_eigen.so"
      - test -z "$(ldd -r "$PREFIX/lib/libmanipulation_position_controllers.so" 2>&1 | grep 'undefined symbol')"
      - test "$(patchelf --print-needed "$PREFIX/lib/libmanipulation_position_controllers.so" | grep -c '^libmpc_osqp.so$')" -eq 1
      - test "$(patchelf --print-needed "$PREFIX/lib/libmanipulation_position_controllers.so" | grep -c '^libmpc_osqp_eigen.so$')" -eq 1
      - test "$(patchelf --print-needed "$PREFIX/lib/libmanipulation_position_controllers.so" | grep -c '^libosqp.so$')" -eq 0
      - test "$(patchelf --print-needed "$PREFIX/lib/libmanipulation_position_controllers.so" | grep -c '^libOsqpEigen\\.so')" -eq 0
      - test "$(patchelf --print-needed "$PREFIX/lib/manipulation_position_controllers/libmpc_osqp_eigen.so" | grep -c '^libmpc_osqp.so$')" -eq 1
      - test ! -d "$PREFIX/include/manipulation_position_controllers"
      - test ! -d "$PREFIX/share/manipulation_position_controllers/cmake"
      - test -z "$(strings "$PREFIX/lib/libmanipulation_position_controllers.so" | grep robot_time_interface)"

about:
  homepage: https://github.com/Gabriel-Ning/phy_ai_runtime_controllers
  repository: https://github.com/Gabriel-Ning/phy_ai_runtime_controllers
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSES/OSQP-Apache-2.0.txt
    - LICENSES/OSQP-NOTICE.txt
    - LICENSES/OsqpEigen-BSD-3-Clause.txt
  summary: Binary-only ROS 2 Jazzy manipulation controller plugins
  description: |
    Runtime package for JointSpacePositionController,
    JointSpaceImpedanceController, TaskSpaceKinematicPositionController, and
    TaskSpaceJointImpedanceController ros2_control plugins. Public headers,
    CMake export targets, examples, tests, and implementation sources are not
    included in this binary distribution.

extra:
  maintainers:
    - Gabriel-Ning
