controller_manager:
  ros__parameters:
    update_rate: 250

    test_jspc:
      type: manipulation_position_controllers/JointSpacePositionController

test_jspc:
  ros__parameters:
    joints: [joint1, joint2]
    input_topic: /test_jspc/reference
    input_qos_depth: 1
    trajectory_behavior:
      mode: limiter
      max_points: 8
      stale_timeout_s: 0.25
      max_velocity_rad_s: 2.0
      max_acceleration_rad_s2: 4.0
      ema_alpha: 1.0
      max_jerk_rad_s3: 10.0
      ruckig_control_cycle_s: 0.004
    status_rate_hz: 20.0
    reject_out_of_bounds_targets: true
    allow_partial_joint_references: false
    reject_zero_stamped_references: true
    lower_limits: [-2.0, -2.0]
    upper_limits: [2.0, 2.0]
