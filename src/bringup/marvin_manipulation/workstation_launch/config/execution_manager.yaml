metadata: {name: marvin_bimanual, version: "2.0"}

# Admission compares the envelope Header stamp with the EM ROS clock. This
# bounds delayed packet pollution; it is not a control-loop latency target.
max_command_age_s: 0.25

# Trusted workstation sources publish plain ROS commands. EM owns their
# internal leases, controller switching, preemption, and fallback.
sources:
  JointPolicy:
    source_role: POLICY
    preempt: false
    inputs:
      left_arm:
        command_contract: joint_reference
        topic: /action_sources/joint_policy/left_arm/joint_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/joint_policy/left_gripper/joint_reference
      right_arm:
        command_contract: joint_reference
        topic: /action_sources/joint_policy/right_arm/joint_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/joint_policy/right_gripper/joint_reference

  CartesianPolicy:
    source_role: POLICY
    preempt: false
    inputs:
      left_arm:
        command_contract: pose_reference
        topic: /action_sources/cartesian_policy/left_arm/pose_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/cartesian_policy/left_gripper/joint_reference
      right_arm:
        command_contract: pose_reference
        topic: /action_sources/cartesian_policy/right_arm/pose_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/cartesian_policy/right_gripper/joint_reference

  Replay:
    source_role: MEMORY
    preempt: false
    inputs:
      left_arm:
        command_contract: joint_reference
        topic: /action_sources/replay/left_arm/joint_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/replay/left_gripper/joint_reference
      right_arm:
        command_contract: joint_reference
        topic: /action_sources/replay/right_arm/joint_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/replay/right_gripper/joint_reference

  DummyPolicy:
    source_role: POLICY
    preempt: false
    inputs:
      left_arm:
        command_contract: joint_reference
        topic: /action_sources/dummy_policy/left_arm/joint_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/dummy_policy/left_gripper/joint_reference
      right_arm:
        command_contract: joint_reference
        topic: /action_sources/dummy_policy/right_arm/joint_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/dummy_policy/right_gripper/joint_reference

  TrajectoryPlanner:
    source_role: PLANNER
    preempt: true
    inputs:
      left_arm:
        command_contract: joint_trajectory
        action: /execution_manager/ingress/planner/left_arm/follow_joint_trajectory
      left_gripper:
        command_contract: gripper_command
        action: /execution_manager/ingress/planner/left_gripper/gripper_command
      right_arm:
        command_contract: joint_trajectory
        action: /execution_manager/ingress/planner/right_arm/follow_joint_trajectory
      right_gripper:
        command_contract: gripper_command
        action: /execution_manager/ingress/planner/right_gripper/gripper_command

  StreamingPlanner:
    source_role: PLANNER
    preempt: true
    inputs:
      left_arm:
        command_contract: joint_reference
        topic: /action_sources/streaming_planner/left_arm/joint_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/streaming_planner/left_gripper/joint_reference
      right_arm:
        command_contract: joint_reference
        topic: /action_sources/streaming_planner/right_arm/joint_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/streaming_planner/right_gripper/joint_reference

  TeleopTwist_Left:
    source_role: TELEOP
    preempt: true
    inputs:
      left_arm:
        command_contract: twist_reference
        topic: /action_sources/teleop_twist_left/left_arm/twist_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_twist_left/left_gripper/joint_reference

  TeleopTwist_Right:
    source_role: TELEOP
    preempt: true
    inputs:
      right_arm:
        command_contract: twist_reference
        topic: /action_sources/teleop_twist_right/right_arm/twist_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_twist_right/right_gripper/joint_reference

  TeleopCartesian_Left:
    source_role: TELEOP
    preempt: true
    activation_topic: /teleop/quest3_bimanual/left_clutch
    inputs:
      left_arm:
        command_contract: pose_reference
        topic: /action_sources/teleop_cartesian_left/left_arm/pose_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_cartesian_left/left_gripper/joint_reference

  TeleopCartesian_Right:
    source_role: TELEOP
    preempt: true
    activation_topic: /teleop/quest3_bimanual/right_clutch
    inputs:
      right_arm:
        command_contract: pose_reference
        topic: /action_sources/teleop_cartesian_right/right_arm/pose_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_cartesian_right/right_gripper/joint_reference

  TeleopJoint_Left:
    source_role: TELEOP
    preempt: true
    activation_topic: /teleop/marvin_joint/clutch
    inputs:
      left_arm:
        command_contract: joint_reference
        topic: /action_sources/teleop_joint_left/left_arm/joint_reference
      left_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_joint_left/left_gripper/joint_reference

  TeleopJoint_Right:
    source_role: TELEOP
    preempt: true
    activation_topic: /teleop/marvin_joint/clutch
    inputs:
      right_arm:
        command_contract: joint_reference
        topic: /action_sources/teleop_joint_right/right_arm/joint_reference
      right_gripper:
        command_contract: joint_reference
        topic: /action_sources/teleop_joint_right/right_gripper/joint_reference

groups:
  left_arm:
    type: arm
    joint_names: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L]
    base_frame: Base_L
    flange_frame: flange_L
    tcp_frame: left_pika_gripper_tcp
    controller_manager: /controller_manager
    default_controller: joint_trajectory
    controllers:
      joint_trajectory:
        name: left_arm_jtc
        ros_actions: {follow_joint_trajectory: /execution/left_arm/follow_joint_trajectory}
        ros_topics: {trajectory_guard_heartbeat: /execution/left_arm/trajectory_guard_heartbeat}
      joint_space_reference:
        name: left_arm_jspc
        ros_topics: {joint_reference: /execution/left_arm/joint_reference}
      task_space_reference:
        name: left_arm_tskpc
        ros_topics: {pose_reference: /execution/left_arm/pose_reference, twist_reference: /execution/left_arm/twist_reference}
  left_gripper:
    type: parallel_gripper
    joint_names: [left_gripper_left_joint]
    parent_group: left_arm
    base_frame: flange_L
    tcp_frame: left_pika_gripper_tcp
    controller_manager: /controller_manager
    default_controller: joint_space_reference
    controllers:
      joint_space_reference:
        name: left_pika_gripper_fwd
        implementation: forward_command_controller/ForwardCommandController
        ros_topics: {joint_reference: /execution/left_gripper/joint_reference}
      gripper_command:
        name: left_pika_gripper_action
        implementation: parallel_gripper_action_controller/GripperActionController
        ros_actions: {gripper_command: /execution/left_gripper/gripper_command}
  right_arm:
    type: arm
    joint_names: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R]
    base_frame: Base_R
    flange_frame: flange_R
    tcp_frame: right_pika_gripper_tcp
    controller_manager: /controller_manager
    default_controller: joint_trajectory
    controllers:
      joint_trajectory:
        name: right_arm_jtc
        ros_actions: {follow_joint_trajectory: /execution/right_arm/follow_joint_trajectory}
        ros_topics: {trajectory_guard_heartbeat: /execution/right_arm/trajectory_guard_heartbeat}
      joint_space_reference:
        name: right_arm_jspc
        ros_topics: {joint_reference: /execution/right_arm/joint_reference}
      task_space_reference:
        name: right_arm_tskpc
        ros_topics: {pose_reference: /execution/right_arm/pose_reference, twist_reference: /execution/right_arm/twist_reference}
  right_gripper:
    type: parallel_gripper
    joint_names: [right_gripper_left_joint]
    parent_group: right_arm
    base_frame: flange_R
    tcp_frame: right_pika_gripper_tcp
    controller_manager: /controller_manager
    default_controller: joint_space_reference
    controllers:
      joint_space_reference:
        name: right_pika_gripper_fwd
        implementation: forward_command_controller/ForwardCommandController
        ros_topics: {joint_reference: /execution/right_gripper/joint_reference}
      gripper_command:
        name: right_pika_gripper_action
        implementation: parallel_gripper_action_controller/GripperActionController
        ros_actions: {gripper_command: /execution/right_gripper/gripper_command}
