  - {id: right_pika_d405_depth, topic: /right_pika_d405/camera/aligned_depth_to_color/image_raw, expected_type: sensor_msgs/msg/Image, required: false, start_gate: false, qos: {mode: sensor_data}}
  - {id: right_pika_fisheye_color, topic: /right_pika_fisheye/image/compressed, expected_type: sensor_msgs/msg/CompressedImage, required: false, start_gate: false, qos: {mode: sensor_data}}
  - {id: head_d435_color, topic: /head_d435/camera/color/image_raw, expected_type: sensor_msgs/msg/Image, required: false, start_gate: false, qos: {mode: sensor_data}}
  - {id: head_d435_depth, topic: /head_d435/camera/aligned_depth_to_color/image_raw, expected_type: sensor_msgs/msg/Image, required: false, start_gate: false, qos: {mode: sensor_data}}
