# Marvin application recording contract. The recorder daemon starts with no
# subscriptions; RMI PREPARE injects this contract for the current session.
schema_version: 1
streams:
  - {id: authority_status, topic: /execution_manager/authority_status, expected_type: execution_manager_interfaces/msg/AuthorityStatus, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: transient_local, depth: 1}}
  - {id: authority_events, topic: /execution_manager/authority_events, expected_type: execution_manager_interfaces/msg/AuthorityEvent, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 100}}

  - {id: source_policy_left_arm, topic: /action_sources/policy/left_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_policy_right_arm, topic: /action_sources/policy/right_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_policy_left_gripper, topic: /action_sources/policy/left_gripper/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
