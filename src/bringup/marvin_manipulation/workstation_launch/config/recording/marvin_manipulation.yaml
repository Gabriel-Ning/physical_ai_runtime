  - {id: source_teleop_left_arm, topic: /action_sources/teleop/left_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_teleop_right_arm, topic: /action_sources/teleop/right_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_teleop_left_pose, topic: /action_sources/teleop/left_arm/pose_reference, expected_type: execution_manager_interfaces/msg/LeasedPoseReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_teleop_right_pose, topic: /action_sources/teleop/right_arm/pose_reference, expected_type: execution_manager_interfaces/msg/LeasedPoseReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_teleop_left_twist, topic: /action_sources/teleop/left_arm/twist_reference, expected_type: execution_manager_interfaces/msg/LeasedTwistReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: source_teleop_right_twist, topic: /action_sources/teleop/right_arm/twist_reference, expected_type: execution_manager_interfaces/msg/LeasedTwistReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_policy_left_arm, topic: /execution_trace/policy/left_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_policy_right_arm, topic: /execution_trace/policy/right_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_policy_left_gripper, topic: /execution_trace/policy/left_gripper/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_policy_right_gripper, topic: /execution_trace/policy/right_gripper/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_teleop_left_arm, topic: /execution_trace/teleop/left_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: trace_teleop_right_arm, topic: /execution_trace/teleop/right_arm/joint_reference, expected_type: execution_manager_interfaces/msg/LeasedJointReference, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}

  - {id: execution_left_arm_joint_reference, topic: /execution/left_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: execution_right_arm_joint_reference, topic: /execution/right_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
