quest3_bimanual_absolute_target:
  ros__parameters:
    profile_name: marvin_quest3_bimanual_absolute
    rate_hz: 50.0

    left_output_topic: /action_sources/teleop_cartesian_left/left_arm/pose_reference
    right_output_topic: /action_sources/teleop_cartesian_right/right_arm/pose_reference
    left_gripper_output_topic: /action_sources/teleop_cartesian_left/left_gripper/joint_reference
    right_gripper_output_topic: /action_sources/teleop_cartesian_right/right_gripper/joint_reference
    left_clutch_topic: /teleop/quest3_bimanual/left_clutch
    right_clutch_topic: /teleop/quest3_bimanual/right_clutch

    left_gripper_joint_name: left_gripper_left_joint
    right_gripper_joint_name: right_gripper_left_joint
    gripper_min_width: 0.000
    gripper_max_width: 0.045
    gripper_speed_mps: 0.050
    require_clutch_for_gripper: false

    output_frame: world
    left_base_frame: Base_L
    right_base_frame: Base_R
    left_tcp_frame: left_pika_gripper_tcp
    right_tcp_frame: right_pika_gripper_tcp
    left_target_frame: teleop_left_ee_target
    right_target_frame: teleop_right_ee_target

    pose_source: grip
    calibrate_source: menu
    calibrate_threshold: 0.5
    enable_deadman: true
    deadman_source: squeeze
    deadman_threshold: 0.5
    require_both_deadman: false

    linear_scale: 1.0
    angular_scale: 1.0
    enable_dynamic_scale: true
    scale_step: 0.1
    min_scale: 0.1
    max_scale: 3.0

    # SE(3) One Euro Filter
    filter_type: one_euro
    one_euro_min_cutoff: 1.0
    one_euro_beta: 0.007
    one_euro_d_cutoff: 1.0

    max_linear_step_m: 0.05
    max_angular_step_rad: 0.25

    use_live_ee_as_home: true
    left_home_xyz: [0.35, 0.20, 0.30]
    left_home_xyzw: [0.0, 0.0, 0.0, 1.0]
    right_home_xyz: [0.35, -0.20, 0.30]
    right_home_xyzw: [0.0, 0.0, 0.0, 1.0]
