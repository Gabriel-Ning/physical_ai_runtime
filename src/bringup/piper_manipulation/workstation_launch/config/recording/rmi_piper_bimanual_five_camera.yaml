schema_version: 1
metadata:
  format: rmi_episode_recorder/v1
  robot: piper_bimanual
  camera_setup: five_camera_view_experiment
streams:
  - {id: authority_status, topic: /execution_manager/authority_status, expected_type: execution_manager_interfaces/msg/AuthorityStatus, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: transient_local, depth: 1}}
  - {id: authority_events, topic: /execution_manager/authority_events, expected_type: execution_manager_interfaces/msg/AuthorityEvent, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 100}}
  - {id: execution_left_arm, topic: /execution/left_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: execution_right_arm, topic: /execution/right_arm/joint_reference, expected_type: trajectory_msgs/msg/JointTrajectory, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: execution_left_gripper_joint_reference, topic: /execution/left_gripper/joint_reference, expected_type: std_msgs/msg/Float64MultiArray, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}
  - {id: execution_right_gripper_joint_reference, topic: /execution/right_gripper/joint_reference, expected_type: std_msgs/msg/Float64MultiArray, required: false, start_gate: false, qos: {mode: explicit, reliability: reliable, durability: volatile, depth: 10}}

  - {id: robot_joint_states, topic: /joint_states, expected_type: sensor_msgs/msg/JointState, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: orbbec_color, topic: /observation/orbbec/color/image_raw, expected_type: sensor_msgs/msg/Image, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: d435i1_color, topic: /observation/d435i1/color/image_raw, expected_type: sensor_msgs/msg/Image, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: d435i2_color, topic: /observation/d435i2/color/image_raw, expected_type: sensor_msgs/msg/Image, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: left_wrist_realsense_color, topic: /observation/left_hand_realsense/color/image_raw, expected_type: sensor_msgs/msg/Image, required: true, start_gate: true, qos: {mode: sensor_data}}
  - {id: right_wrist_realsense_color, topic: /observation/right_hand_realsense/color/image_raw, expected_type: sensor_msgs/msg/Image, required: true, start_gate: true, qos: {mode: sensor_data}}
