# FR3 fake-hardware controllers. mock_components/GenericSystem mirrors
# position commands to state; effort impedance controllers do not move.
# Keep the same controller names/topics as the real effort profile so RMI
# does not need a second embodiment YAML.
controller_manager:
  ros__parameters:
    update_rate: 1000
    thread_priority: 98
    overruns:
      manage: false
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_arm_tsjic:
      type: manipulation_position_controllers/TaskSpaceKinematicPositionController

    franka_arm_jsic:
      type: manipulation_position_controllers/JointSpacePositionController

    franka_arm_jtc:
      type: joint_trajectory_controller/JointTrajectoryController

    pika_gripper_fwd:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0

pika_gripper_fwd:
  ros__parameters:
    joints: [gripper_left_joint]
    interface_name: position

franka_arm_tsjic:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    base_frame: fr3_link0
    tip_frame: pika_gripper_tcp
    # Downstream RT endpoints. Execution Manager authority topics are telemetry only.
    input_topic: /execution/arm/pose_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      max_points: 64
      untimed_frame_dt_s: 0.02
    twist_topic: /execution/arm/twist_reference
    stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.5
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    max_command_tracking_error_rad: 0.35
    status_rate_hz: 10.0

    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    lower_limits: [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
    upper_limits: [ 2.9007,  1.8361,  2.9007, -0.1169,  2.8763, 4.6216,  3.0508]

franka_arm_jsic:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    input_topic: /execution/arm/joint_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      mode: ruckig
      max_points: 1
      stale_timeout_s: 0.5
      max_velocity_rad_s: 2.5
      max_acceleration_rad_s2: 10.0
      max_jerk_rad_s3: 150.0
      ruckig_control_cycle_s: 0.001
      ema_alpha: 0.95
    lower_limits: [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
    upper_limits: [2.9007, 1.8361, 2.9007, -0.1169, 2.8763, 4.6216, 3.0508]
    allow_partial_joint_references: false
    reject_out_of_bounds_targets: true

franka_arm_jtc:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    constraints:
      decelerate_on_cancel: true
      fr3_joint1: {max_deceleration_on_cancel: 3.75}
      fr3_joint2: {max_deceleration_on_cancel: 1.875}
      fr3_joint3: {max_deceleration_on_cancel: 2.5}
      fr3_joint4: {max_deceleration_on_cancel: 3.125}
      fr3_joint5: {max_deceleration_on_cancel: 3.75}
      fr3_joint6: {max_deceleration_on_cancel: 5.0}
      fr3_joint7: {max_deceleration_on_cancel: 5.0}
