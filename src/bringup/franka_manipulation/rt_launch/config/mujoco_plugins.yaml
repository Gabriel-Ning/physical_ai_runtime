/**:
  ros__parameters:
    mujoco_plugins:
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        # Explicit policies are the source of truth for CameraPlugin and bridge.
        default_policy: disabled
        shm_prefix: /pai_mj_cam_
        camera_publish_rate: 30.0
        # ros: publish in CM; shm: SHM only, independent bridge publishes images;
        # both: debug only (SHM plus in-process ROS publishers).
        output: shm
        head_camera:
          policy: disabled
        agentview:
          policy: streaming
          frame_name: agentview_color_optical_frame
          info_topic: /agentview/camera/color/camera_info
          image_topic: /agentview/camera/color/image_raw
          depth_topic: /agentview/camera/aligned_depth_to_color/image_raw
        pika_d405:
          policy: streaming
          frame_name: pika_d405_color_optical_frame
          info_topic: /pika_d405/camera/color/camera_info
          image_topic: /pika_d405/camera/color/image_raw
          depth_topic: /pika_d405/camera/aligned_depth_to_color/image_raw
        frontview:
          policy: disabled
        birdview:
          policy: disabled
        sideview:
          policy: disabled
        wrist_camera:
          policy: disabled
        robot0_eye_in_hand:
          policy: disabled
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        topic: /free_joint_states
        publish_rate: 50.0
