#
# Workstation external RealSense (AA host).
# Enumerated 2026-08-20 as D430 serial 309422070502 (USB PID 0AD4).
# D430 has Stereo Depth + Infra only — no RGB color stream.
# Prefer a USB 3 port; USB 2 often triggers uvc streamer watchdog.
#
# Launch:
#   ros2 launch marvin_manipulation_controller_bringup camera_bringup.launch.py

workstation_realsense:
  camera:
    ros__parameters:
      camera_name: "workstation_realsense"
      serial_no: "_309422070502"
      base_frame_id: "workstation_realsense_link"
      enable_color: false
      enable_depth: true
      enable_infra: false
      enable_infra1: false
      enable_infra2: false
      enable_sync: false
      depth_module:
        depth_profile: "848x480x30"
        depth_format: "Z16"
        global_time_enabled: true
        frames_queue_size: 2
      align_depth:
        enable: false
        frames_queue_size: 2
      pointcloud:
        enable: false
      clip_distance: -1.0
