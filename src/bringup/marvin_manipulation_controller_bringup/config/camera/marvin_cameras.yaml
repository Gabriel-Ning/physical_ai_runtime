#
# Perception cameras for Marvin bimanual + dual Pika grippers.
# Same stack as FR3 Pika: RealSense D405 + Sunplus DECXIN fisheye per gripper.
#
# ROS node params for realsense2_camera / usb_cam.
#
# Site identity currently matches gamma RT host (192.168.1.102); re-verify after
# cabling changes. Fisheye: /dev/fisheye0 (left USB 3-9.1), /dev/fisheye1 (right USB 3-7.1).
# D405 ROS serials follow the same left/right hubs as ttyUSB1 / ttyUSB0.

left_pika_d405:
  camera:
    ros__parameters:
      camera_name: "left_pika_d405"
      serial_no: "_315122272081"
      base_frame_id: "left_pika_d405_link"
      enable_color: true
      enable_depth: true
      enable_infra: false
      enable_infra1: false
      enable_infra2: false
      enable_sync: false
      depth_module:
        color_profile: "848x480x30"
        color_format: "RGB8"
        depth_profile: "848x480x30"
        depth_format: "Z16"
        global_time_enabled: true
        frames_queue_size: 2
      align_depth:
        enable: false
        frames_queue_size: 2
      pointcloud:
        enable: false
      clip_distance: -1.0

left_pika_fisheye:
  camera:
    ros__parameters:
      camera_name: "left_pika_fisheye"
      # USB 3-9.1 (same hub as left ttyUSB1). Prefer /dev/fisheye0 after udev.
      video_device: "/dev/fisheye0"
      frame_id: "left_pika_fisheye_link"
      timestamp_mode: "System"
      image_width: 1280
      image_height: 720
      framerate: 30.0
      pixel_format: "mjpeg2rgb"
      io_method: "mmap"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      autoexposure: true

right_pika_d405:
  camera:
    ros__parameters:
      camera_name: "right_pika_d405"
      serial_no: "_315122272176"
      base_frame_id: "right_pika_d405_link"
      enable_color: true
      enable_depth: true
      enable_infra: false
      enable_infra1: false
      enable_infra2: false
      enable_sync: false
      depth_module:
        color_profile: "848x480x30"
        color_format: "RGB8"
        depth_profile: "848x480x30"
        depth_format: "Z16"
        global_time_enabled: true
        frames_queue_size: 2
      align_depth:
        enable: false
        frames_queue_size: 2
      pointcloud:
        enable: false
      clip_distance: -1.0

right_pika_fisheye:
  camera:
    ros__parameters:
      camera_name: "right_pika_fisheye"
      # USB 3-7.1 (same hub as right ttyUSB0). Prefer /dev/fisheye1 after udev.
      video_device: "/dev/fisheye1"
      frame_id: "right_pika_fisheye_link"
      timestamp_mode: "System"
      image_width: 1280
      image_height: 720
      framerate: 30.0
      pixel_format: "mjpeg2rgb"
      io_method: "mmap"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      autoexposure: true
