# ros2_control profile for the Marvin bimanual manipulation server.
# Hardware selection is owned by the URDF launch arguments.
controller_manager:
  ros__parameters:
    update_rate: 500
    thread_priority: 80
    overruns:
      manage: false
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_tskpc:
      type: manipulation_position_controllers/TaskSpaceKinematicPositionController

    right_arm_tskpc:
      type: manipulation_position_controllers/TaskSpaceKinematicPositionController
    left_arm_jspc:
      type: manipulation_position_controllers/JointSpacePositionController
    right_arm_jspc:
      type: manipulation_position_controllers/JointSpacePositionController
    left_arm_jtc:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_jtc:
      type: joint_trajectory_controller/JointTrajectoryController
    left_pika_gripper_fwd:
      type: forward_command_controller/ForwardCommandController
    right_pika_gripper_fwd:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0

left_pika_gripper_fwd:
  ros__parameters:
    joints: [left_gripper_left_joint]
    interface_name: position

right_pika_gripper_fwd:
  ros__parameters:
    joints: [right_gripper_left_joint]
    interface_name: position

left_arm_tskpc:
  ros__parameters:
    joints:
      - Joint1_L
      - Joint2_L
      - Joint3_L
      - Joint4_L
      - Joint5_L
      - Joint6_L
      - Joint7_L

    base_frame: Base_L
    tip_frame: left_pika_gripper_tcp

    # Downstream RT endpoints. /execution_manager/* is EM telemetry only.
    input_topic: /execution/left_arm/pose_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      max_points: 64
      untimed_frame_dt_s: 0.02
    twist_topic: /execution/left_arm/twist_reference

    stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.0
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    max_command_tracking_error_rad: 0.35
    status_rate_hz: 10.0

    # osqp mirrors pinocchio_dls's gain semantics (see osqp_solver.hpp) --
    # do not reuse the much higher placo gains here, they would
    # overshoot/oscillate in the direct QP formulation.
    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    # Native M6 joint1..joint7 position limits, copied from
    # marvin_description/config/joint_limits.yaml (also the URDF's source of
    # truth via xacro). TaskSpaceKinematicPositionController does not read
    # URDF <limit> tags itself -- it only clamps to lower_limits/upper_limits
    # if explicitly given here, otherwise it defaults to +-inf (unlimited).
    lower_limits: [-2.9671, -2.0944, -2.9671, -2.5307, -2.9671, -1.0472, -1.5708]
    upper_limits: [ 2.9671,  2.0944,  2.9671,  1.0472,  2.9671,  1.0472,  1.5708]

right_arm_tskpc:
  ros__parameters:
    joints:
      - Joint1_R
      - Joint2_R
      - Joint3_R
      - Joint4_R
      - Joint5_R
      - Joint6_R
      - Joint7_R

    base_frame: Base_R
    tip_frame: right_pika_gripper_tcp

    # Downstream RT endpoints. /execution_manager/* is EM telemetry only.
    input_topic: /execution/right_arm/pose_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      max_points: 64
      untimed_frame_dt_s: 0.02
    twist_topic: /execution/right_arm/twist_reference

    stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.0
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    max_command_tracking_error_rad: 0.35
    status_rate_hz: 10.0

    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    # Same native per-joint limits as the left arm above, mirrored L/R.
    lower_limits: [-2.9671, -2.0944, -2.9671, -2.5307, -2.9671, -1.0472, -1.5708]
    upper_limits: [ 2.9671,  2.0944,  2.9671,  1.0472,  2.9671,  1.0472,  1.5708]

left_arm_jspc:
  ros__parameters:
    joints: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L]
    input_topic: /execution/left_arm/joint_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      mode: ruckig
      max_points: 1
      stale_timeout_s: 0.2
      max_velocity_rad_s: 2.0
      max_acceleration_rad_s2: 8.0
      max_jerk_rad_s3: 20.0
      ruckig_control_cycle_s: 0.002
      ema_alpha: 0.7
    lower_limits: [-2.9671, -2.0944, -2.9671, -2.5307, -2.9671, -1.0472, -1.5708]
    upper_limits: [2.9671, 2.0944, 2.9671, 1.0472, 2.9671, 1.0472, 1.5708]

right_arm_jspc:
  ros__parameters:
    joints: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R]
    input_topic: /execution/right_arm/joint_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      mode: ruckig
      max_points: 1
      stale_timeout_s: 0.2
      max_velocity_rad_s: 2.0
      max_acceleration_rad_s2: 8.0
      max_jerk_rad_s3: 20.0
      ruckig_control_cycle_s: 0.002
      ema_alpha: 0.7
    lower_limits: [-2.9671, -2.0944, -2.9671, -2.5307, -2.9671, -1.0472, -1.5708]
    upper_limits: [2.9671, 2.0944, 2.9671, 1.0472, 2.9671, 1.0472, 1.5708]

left_arm_jtc:
  ros__parameters:
    joints: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    set_last_command_interface_value_as_state_on_activation: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      decelerate_on_cancel: true
      Joint1_L: {max_deceleration_on_cancel: 8.0}
      Joint2_L: {max_deceleration_on_cancel: 8.0}
      Joint3_L: {max_deceleration_on_cancel: 8.0}
      Joint4_L: {max_deceleration_on_cancel: 8.0}
      Joint5_L: {max_deceleration_on_cancel: 8.0}
      Joint6_L: {max_deceleration_on_cancel: 8.0}
      Joint7_L: {max_deceleration_on_cancel: 8.0}

right_arm_jtc:
  ros__parameters:
    joints: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    set_last_command_interface_value_as_state_on_activation: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      decelerate_on_cancel: true
      Joint1_R: {max_deceleration_on_cancel: 8.0}
      Joint2_R: {max_deceleration_on_cancel: 8.0}
      Joint3_R: {max_deceleration_on_cancel: 8.0}
      Joint4_R: {max_deceleration_on_cancel: 8.0}
      Joint5_R: {max_deceleration_on_cancel: 8.0}
      Joint6_R: {max_deceleration_on_cancel: 8.0}
      Joint7_R: {max_deceleration_on_cancel: 8.0}
