#
# Perception Camera Parameters for Pika Gripper setup on Franka FR3 (Standard 30 Hz Profile).
# Includes:
#   1. RealSense D405 (Wrist Close-range RGB-D @ 30Hz, 848x480)
#   2. Sunplus DECXIN Fisheye (Wrist Ultra-wide RGB @ 30Hz, 1280x720)

pika_d405:
  camera:
    ros__parameters:
      camera_name: "pika_d405"
      serial_no: "_323622270897"
      base_frame_id: "pika_d405_link"
      enable_color: true
      enable_depth: true
      enable_infra: false
      enable_infra1: false
      enable_infra2: false
      enable_sync: false
      # Standard 30 FPS profile for D405:
      depth_module:
        color_profile: "848x480x30"
        color_format: "RGB8"
        depth_profile: "848x480x30"
        depth_format: "Z16"
        global_time_enabled: true
        frames_queue_size: 2
      align_depth:
        enable: false
        frames_queue_size: 2
      pointcloud:
        enable: false
      clip_distance: -1.0

pika_fisheye:
  camera:
    ros__parameters:
      camera_name: "pika_fisheye"
      video_device: "/dev/video12"
      frame_id: "pika_fisheye_link"
      timestamp_mode: "System"
      # Standard 30 FPS 720p HD profile:
      image_width: 1280
      image_height: 720
      framerate: 30.0
      pixel_format: "mjpeg2rgb"
      io_method: "mmap"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      autoexposure: true
