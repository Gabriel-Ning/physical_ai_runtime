# ros2_control profile for the Physical AI Runtime FR3 effort path.
# pose → Diff-IK → joint impedance → <joint>/effort
# Velocity MG path is not shipped; use effort (TSJI).
controller_manager:
  ros__parameters:
    update_rate: 1000
    thread_priority: 98
    overruns:
      manage: false
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_arm_tsjic:
      type: manipulation_position_controllers/TaskSpaceJointImpedanceController

    franka_arm_jsic:
      type: manipulation_position_controllers/JointSpaceImpedanceController

    franka_arm_jtc:
      type: joint_trajectory_controller/JointTrajectoryController

    pika_gripper_fwd:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0

pika_gripper_fwd:
  ros__parameters:
    joints: [gripper_left_joint]
    interface_name: position

franka_arm_tsjic:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    base_frame: fr3_link0
    tip_frame: pika_gripper_tcp
    # Downstream RT endpoints. /execution_manager/* is EM telemetry only.
    input_topic: /execution/arm/pose_reference
    reject_zero_stamped_references: true
    trajectory_behavior:
      max_points: 64
      untimed_frame_dt_s: 0.02
    twist_topic: /execution/arm/twist_reference
    twist_stale_timeout_s: 0.2

    stale_timeout_s: 0.2
    max_joint_velocity_rad_s: 1.5
    max_linear_velocity_m_s: 0.5
    max_angular_velocity_rad_s: 1.0
    status_rate_hz: 10.0
    velocity_filter_alpha: 0.99

    solver:
      backend: osqp
      position_gain: 4.0
      orientation_gain: 1.0
      damping: 0.05
      posture_weight: 1.0e-3
      max_iterations: 1

    kp_stiffness: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
    kd_damping: [30.0, 30.0, 30.0, 30.0, 10.0, 10.0, 5.0]
    max_torques: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
    max_torque_rates: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]

    lower_limits: [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
    upper_limits: [ 2.9007,  1.8361,  2.9007, -0.1169,  2.8763, 4.6216,  3.0508]

franka_arm_jsic:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    input_topic: /execution/arm/joint_reference
    reject_zero_stamped_references: true
    kp_stiffness: [1000.0, 1000.0, 1000.0, 1000.0, 500.0, 320.0, 150.0]
    kd_damping: [25.0, 25.0, 25.0, 25.0, 12.0, 10.0, 5.0]
    max_torques: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
    velocity_filter_alpha: 0.99
    trajectory_behavior:
      mode: ruckig
      max_points: 1
      stale_timeout_s: 0.5
      max_velocity_rad_s: 2.5
      max_acceleration_rad_s2: 10.0
      max_jerk_rad_s3: 150.0
      ruckig_control_cycle_s: 0.001
      ema_alpha: 0.95
    lower_limits: [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
    upper_limits: [2.9007, 1.8361, 2.9007, -0.1169, 2.8763, 4.6216, 3.0508]
    allow_partial_joint_references: false
    reject_out_of_bounds_targets: true

franka_arm_jtc:
  ros__parameters:
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    gains:
      fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint7: {p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0}
    # JTC computes a stopping trajectory on action cancel. Values mirror the
    # FR3 MoveIt acceleration limits instead of applying an instantaneous hold.
    constraints:
      decelerate_on_cancel: true
      fr3_joint1: {max_deceleration_on_cancel: 3.75}
      fr3_joint2: {max_deceleration_on_cancel: 1.875}
      fr3_joint3: {max_deceleration_on_cancel: 2.5}
      fr3_joint4: {max_deceleration_on_cancel: 3.125}
      fr3_joint5: {max_deceleration_on_cancel: 3.75}
      fr3_joint6: {max_deceleration_on_cancel: 5.0}
      fr3_joint7: {max_deceleration_on_cancel: 5.0}
