schema_version: 1
streams:
  - id: execution_arm_joint_reference
    topic: /execution/arm/joint_reference
    expected_type: trajectory_msgs/msg/JointTrajectory
    required: true
    start_gate: false
    qos:
      mode: explicit
      reliability: reliable
      durability: volatile
      depth: 10

  - id: execution_end_effector_joint_reference
